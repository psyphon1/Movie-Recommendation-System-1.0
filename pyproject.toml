[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "movie-recommendation-system"
version = "1.0.0"
description = "Movie recommendation system using TF-IDF and cosine similarity"
requires-python = ">=3.9,<4.0"
dependencies = [
    "Flask==3.0.0",
    "pandas==2.0.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.3.0",
    "Werkzeug==3.0.0",
    "python-dotenv==1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
]

[tool.setuptools]
packages = []
